<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Football Shirt Shop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <div class="login-card">
        <a href="{{ url_for('login') }}" class="logo" style="display:block; text-align:center; margin-bottom:1.5rem;">Football Shirt Shop</a>
        <h1>Sign in</h1>
        {% with messages = get_flashed_messages() %}{% if messages %}<div class="alert">{{ messages[0] }}</div>{% endif %}{% endwith %}
        <form method="POST">
            <div class="form-group"><label for="username">Username</label><input type="text" id="username" name="username" placeholder="admin or customer" required autofocus></div>
            <div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" placeholder="123 or pass" required></div>
            <button type="submit" class="btn-add-to-cart" style="width:100%;">Sign in</button>
        </form>
        <p style="text-align:center; margin-top:1rem;">No user? <a href="{{ url_for('signup') }}">Create one</a></p>
    </div>
</body>
</html>
