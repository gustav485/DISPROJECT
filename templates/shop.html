{% extends "base.html" %}

{% block title %}Shop — All Products{% endblock %}

{% block content %}
<section class="shop-header">
    <h1>Our Products</h1>
    <p>{{ products|length }} items available</p>
</section>

<div class="product-grid">
    {% for product in products %}
    <div class="product-card">
        <a href="{{ url_for('product', product_id=product.id) }}">
            <img src="{{ product.image }}" alt="{{ product.name }}">
        </a>
        <div class="product-info">
            <span class="product-category">{{ product.category }}</span>
            <a href="{{ url_for('product', product_id=product.id) }}"><h2>{{ product.name }}</h2></a>
            <p class="product-price">${{ "%.2f"|format(product.price) }}</p>
            <form action="{{ url_for('cart_add_route', product_id=product.id) }}" method="POST">
                <input type="hidden" name="next" value="{{ url_for('index') }}">
                <button type="submit" class="btn-cart">Add to Cart</button>
            </form>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
