{% extends "base.html" %}

{% block title %}{{ product.name }} — MyShop{% endblock %}

{% block content %}
<a href="{{ url_for('index') }}" class="back-link">&larr; Back to shop</a>

<div class="product-detail">
    <div class="product-detail-image">
        <img src="{{ product.image }}" alt="{{ product.name }}">
    </div>
    <div class="product-detail-info">
        <span class="product-category">{{ product.category }}</span>
        <h1>{{ product.name }}</h1>
        <p class="product-price">${{ "%.2f"|format(product.price) }}</p>
        <p class="product-description">{{ product.description }}</p>
        <form action="{{ url_for('cart_add_route', product_id=product.id) }}" method="POST">
            <input type="hidden" name="next" value="{{ url_for('product', product_id=product.id) }}">
            <button type="submit" class="btn-add-to-cart">Add to Cart</button>
        </form>
    </div>
</div>
{% endblock %}
