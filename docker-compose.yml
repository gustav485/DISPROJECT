version: '3'

services:
  database:
    image: postgres:16
    container_name: football_shop_database
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: UIS
      POSTGRES_DB: football_shop
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d football_shop -t 1"]
      interval: 5s
      timeout: 5s
      retries: 10
